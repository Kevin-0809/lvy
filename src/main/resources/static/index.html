<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lvy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="progress" class="progress"></div>

<div class="app">
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <a class="brand" href="/" id="brand">lvy</a>
            <button class="icon-btn collapse-btn" id="collapseBtn" title="折叠侧边栏">
                <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
        </div>

        <nav class="sidebar-nav" id="sidebarNav">
            <button class="nav-item active" data-view="collections">
                <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                <span>集合</span>
            </button>
            <button class="nav-item" data-view="history">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
                <span>历史</span>
            </button>
            <button class="nav-item" data-view="environments">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/></svg>
                <span>环境</span>
            </button>
        </nav>

        <div class="sidebar-body">
            <section class="side-view active" id="view-collections">
                <div class="side-view-head">
                    <span>集合</span>
                    <button class="icon-btn" id="newCollectionBtn" title="新建集合">
                        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
                <div class="side-list" id="collectionList"></div>
            </section>

            <section class="side-view" id="view-history">
                <div class="side-view-head">
                    <span>历史</span>
                    <button class="icon-btn" id="clearHistoryBtn" title="清空历史">
                        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 12h10l1-12"/></svg>
                    </button>
                </div>
                <div class="side-list" id="historyList"></div>
            </section>

            <section class="side-view" id="view-environments">
                <div class="side-view-head">
                    <span>环境</span>
                    <button class="icon-btn" id="newEnvBtn" title="新建环境">
                        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
                <div class="side-list" id="envList"></div>
            </section>
        </div>
    </aside>

    <!-- 右侧主区 -->
    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <label class="env-picker">
                    <span>环境</span>
                    <select id="envSelect">
                        <option value="">全部变量</option>
                    </select>
                </label>
            </div>
            <div class="topbar-right">
                <button class="ghost-btn" id="resetBtn">重置</button>
                <button class="ghost-btn" id="saveBtn">保存</button>
            </div>
        </header>

        <div class="workspace">
            <!-- 请求区 -->
            <section class="pane request-pane">
                <div class="url-bar">
                    <select id="methodSelect" class="method-select">
                        <option>GET</option>
                        <option>POST</option>
                        <option>PUT</option>
                        <option>DELETE</option>
                        <option>PATCH</option>
                        <option>HEAD</option>
                        <option>OPTIONS</option>
                    </select>
                    <input id="urlInput" class="url-input" type="text" spellcheck="false"
                           placeholder="https://api.example.com/users 或 {{baseUrl}}/users"/>
                    <button id="sendBtn" class="send-btn">发送</button>
                </div>

                <div class="tabs" id="requestTabs">
                    <button class="tab active" data-tab="params">Params <span class="tab-count" id="paramsCount"></span></button>
                    <button class="tab" data-tab="headers">Headers <span class="tab-count" id="headersCount"></span></button>
                    <button class="tab" data-tab="body">Body</button>
                    <button class="tab" data-tab="auth">Auth</button>
                </div>

                <div class="tab-panels">
                    <div class="tab-panel active" data-panel="params">
                        <div class="kv-table" id="paramsTable"></div>
                    </div>
                    <div class="tab-panel" data-panel="headers">
                        <div class="kv-table" id="headersTable"></div>
                    </div>
                    <div class="tab-panel" data-panel="body">
                        <div class="inline-field">
                            <label>类型</label>
                            <div class="radio-group" id="bodyTypeGroup">
                                <label><input type="radio" name="bodyType" value="none" checked><span>none</span></label>
                                <label><input type="radio" name="bodyType" value="raw"><span>raw</span></label>
                                <label><input type="radio" name="bodyType" value="x-www-form-urlencoded"><span>form-urlencoded</span></label>
                                <label><input type="radio" name="bodyType" value="form-data"><span>form-data</span></label>
                            </div>
                        </div>
                        <div id="bodyNone" class="body-area">
                            <p class="hint">该请求不包含请求体</p>
                        </div>
                        <div id="bodyRaw" class="body-area hidden">
                            <div class="editor-toolbar">
                                <span class="toolbar-label">raw</span>
                                <span class="toolbar-spacer"></span>
                                <button class="mini-btn" id="formatReqBodyBtn" type="button">格式化</button>
                                <button class="mini-btn" id="minifyReqBodyBtn" type="button">压缩</button>
                            </div>
                            <textarea id="rawBodyInput" class="code-input" spellcheck="false"
                                      placeholder='{&#10;  "name": "lvy"&#10;}'></textarea>
                        </div>
                        <div id="bodyForm" class="body-area hidden">
                            <div class="kv-table" id="bodyFormTable"></div>
                        </div>
                    </div>
                    <div class="tab-panel" data-panel="auth">
                        <div class="inline-field">
                            <label>类型</label>
                            <div class="radio-group" id="authTypeGroup">
                                <label><input type="radio" name="authType" value="none" checked><span>无</span></label>
                                <label><input type="radio" name="authType" value="bearer"><span>Bearer Token</span></label>
                                <label><input type="radio" name="authType" value="basic"><span>Basic Auth</span></label>
                            </div>
                        </div>
                        <div id="authBearer" class="auth-area hidden">
                            <div class="field-row">
                                <label>Token</label>
                                <input type="text" id="bearerToken" class="text-input" spellcheck="false" placeholder="粘贴 token">
                            </div>
                        </div>
                        <div id="authBasic" class="auth-area hidden">
                            <div class="field-row">
                                <label>用户名</label>
                                <input type="text" id="basicUsername" class="text-input" spellcheck="false">
                            </div>
                            <div class="field-row">
                                <label>密码</label>
                                <input type="text" id="basicPassword" class="text-input" spellcheck="false">
                            </div>
                        </div>
                        <div id="authNone" class="auth-area">
                            <p class="hint">不添加认证信息</p>
                        </div>
                    </div>
                </div>
            </section>

            <div class="divider" id="divider" title="拖拽调整高度"></div>

            <!-- 响应区 -->
            <section class="pane response-pane">
                <div class="response-head">
                    <div class="status" id="responseStatus">
                        <span class="status-empty">尚未发送请求</span>
                    </div>
                    <div class="response-head-right">
                        <div class="tabs small" id="responseTabs">
                            <button class="tab active" data-rtab="pretty">Body</button>
                            <button class="tab" data-rtab="headers">Headers</button>
                            <button class="tab" data-rtab="raw">Raw</button>
                        </div>
                        <button class="mini-btn" id="formatRespBtn" type="button">格式化</button>
                        <button class="mini-btn" id="minifyRespBtn" type="button">压缩</button>
                    </div>
                </div>
                <div class="response-body">
                    <div class="response-panel active" data-rpanel="pretty" id="responsePretty"></div>
                    <div class="response-panel" data-rpanel="headers" id="responseHeaders"></div>
                    <div class="response-panel" data-rpanel="raw" id="responseRaw"></div>
                </div>
            </section>
        </div>
    </main>
</div>

<!-- 集合名称输入弹层 -->
<div class="overlay hidden" id="promptOverlay">
    <div class="modal">
        <h3 id="promptTitle">新建集合</h3>
        <input type="text" id="promptInput" class="text-input" placeholder="名称">
        <div class="modal-actions">
            <button class="ghost-btn" id="promptCancel">取消</button>
            <button class="primary-btn" id="promptConfirm">确定</button>
        </div>
    </div>
</div>

<!-- 保存请求弹层 -->
<div class="overlay hidden" id="saveOverlay">
    <div class="modal">
        <h3>保存请求</h3>
        <label class="modal-label">名称</label>
        <input type="text" id="saveName" class="text-input" placeholder="请求名称">
        <label class="modal-label">保存到集合</label>
        <div class="save-collection-row">
            <select id="saveCollection" class="text-input"></select>
            <button class="ghost-btn" id="saveNewCollectionBtn">新建</button>
        </div>
        <div class="modal-actions">
            <button class="ghost-btn" id="saveCancel">取消</button>
            <button class="primary-btn" id="saveConfirm">保存</button>
        </div>
    </div>
</div>

<!-- 环境编辑弹层 -->
<div class="overlay hidden" id="envOverlay">
    <div class="modal wide">
        <h3 id="envModalTitle">编辑环境</h3>
        <label class="modal-label">名称</label>
        <input type="text" id="envName" class="text-input" placeholder="如：本地 / 测试 / 生产">
        <label class="modal-label">变量（key = {{key}}）</label>
        <div class="kv-table" id="envVarTable"></div>
        <div class="modal-actions">
            <button class="danger-btn hidden" id="envDeleteBtn">删除</button>
            <span class="modal-spacer"></span>
            <button class="ghost-btn" id="envCancel">取消</button>
            <button class="primary-btn" id="envSave">保存</button>
        </div>
    </div>
</div>

<div class="toast-root" id="toastRoot"></div>

<script src="/js/app.js"></script>
</body>
</html>
