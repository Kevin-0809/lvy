<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lvy 工作台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/console.css">
</head>
<body>
<div class="cm-app">
    <aside class="cm-sidebar">
        <div class="cm-brand">
            <div class="cm-brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 7l8-4 8 4-8 4-8-4z"/>
                    <path d="M4 7v10l8 4 8-4V7"/>
                    <path d="M12 11v10"/>
                </svg>
            </div>
            <div>
                <div class="cm-brand-name">lvy</div>
                <div class="cm-brand-sub">API 与报文平台</div>
            </div>
        </div>

        <nav class="cm-nav">
            <div class="cm-nav-group">
                <div class="cm-nav-group-title">工作台</div>
                <a class="cm-nav-item active" href="/">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 11l8-7 8 7"/>
                        <path d="M6 10v10h12V10"/>
                    </svg>
                    <span>首页</span>
                </a>
            </div>
            <div class="cm-nav-group">
                <div class="cm-nav-group-title">功能菜单</div>
                <a class="cm-nav-item" href="/http-client.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 6h16v12H4z"/>
                        <path d="M8 10l2 2-2 2M13 14h4"/>
                    </svg>
                    <span>HTTP 在线客户端</span>
                </a>
                <a class="cm-nav-item" href="/msg-migration.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="6" rx="7" ry="3"/>
                        <path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/>
                        <path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>
                    </svg>
                    <span>报文迁移</span>
                </a>
            </div>
        </nav>
    </aside>

    <div class="cm-main">
        <header class="cm-topbar">
            <div class="cm-env">
                <span class="cm-env-dot"></span>
                本地环境
            </div>
            <div class="cm-user">
                <span class="cm-user-badge">本</span>
                <span>本地环境</span>
            </div>
        </header>

        <main class="cm-content">
            <div class="cm-home-intro">
                <div>
                    <div class="cm-home-kicker">Developer workspace / 01</div>
                    <h1 class="cm-page-title">工作台</h1>
                    <p class="cm-page-desc">把请求调试、报文采集和本地验证集中在一个安静、清晰的工作区。</p>
                </div>
                <div class="cm-status-card">
                    <small>当前工作空间</small>
                    <strong><span class="cm-env-dot"></span>本地环境 · 已连接</strong>
                </div>
            </div>
            <div class="cm-stat-grid">
                <div class="cm-stat"><span class="cm-stat-label">可用工具</span><strong class="cm-stat-value">02</strong></div>
                <div class="cm-stat"><span class="cm-stat-label">请求体格式</span><strong class="cm-stat-value">05</strong></div>
                <div class="cm-stat"><span class="cm-stat-label">数据源状态</span><strong class="cm-stat-value">Ready</strong></div>
            </div>

            <div class="cm-tiles">
                <a class="cm-tile" href="/http-client.html">
                    <div class="cm-tile-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 6h16v12H4z"/>
                            <path d="M8 10l2 2-2 2M13 14h4"/>
                        </svg>
                    </div>
                    <div class="cm-tile-title">HTTP 在线客户端</div>
                    <div class="cm-tile-desc">
                        发送 HTTP 请求，管理集合与历史，支持 raw、JSON、XML、表单等请求体。
                    </div>
                    <div class="cm-tile-go">进入 &gt;</div>
                </a>

                <a class="cm-tile" href="/msg-migration.html">
                    <div class="cm-tile-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <ellipse cx="12" cy="6" rx="7" ry="3"/>
                            <path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/>
                            <path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>
                        </svg>
                    </div>
                    <div class="cm-tile-title">报文迁移</div>
                    <div class="cm-tile-desc">
                        按服务码从 bxds 数据源分区采集 bzjson / soap 报文，本地落明文，支持查看与修改。
                    </div>
                    <div class="cm-tile-go">进入 &gt;</div>
                </a>
            </div>
        </main>
    </div>
</div>
</body>
</html>
