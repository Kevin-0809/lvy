server:
  port: 8080

spring:
  application:
    name: lvy
  datasource:
    url: jdbc:h2:file:./data/lvy
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: info
    cn.sunline.lvy: info
