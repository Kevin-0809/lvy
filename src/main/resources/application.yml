server:
  port: 8080

spring:
  application:
    name: lvy
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: info
    cn.sunline.lvy: info

ivy:
  web:
    allowed-origins: ${IVY_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  datasource:
    tss:
      url: ${TSS_DATASOURCE_URL:jdbc:postgresql://localhost:15432/postgres}
      username: ${TSS_DATASOURCE_USERNAME:tss}
      password: ${TSS_DATASOURCE_PASSWORD:Tss@123456}
      driver-class-name: ${TSS_DATASOURCE_DRIVER:org.postgresql.Driver}
    # bxds 源数据源（openGauss，PostgreSQL 协议），仅用于报文采集读取。
    # 生产环境请通过环境变量覆盖密码等敏感信息。
    bxds:
      url: ${BXDS_DATASOURCE_URL:jdbc:postgresql://localhost:15432/postgres}
      username: ${BXDS_DATASOURCE_USERNAME:adp}
      password: ${BXDS_DATASOURCE_PASSWORD:OpenGauss@123}
      driver-class-name: ${BXDS_DATASOURCE_DRIVER:org.postgresql.Driver}
  msg-migration:
    charset: ${MSG_MIGRATION_CHARSET:UTF-8}
    # 多服务码并发采集的线程数（有界并发）与等待队列容量。
    concurrency: ${MSG_MIGRATION_CONCURRENCY:4}
    queue-capacity: ${MSG_MIGRATION_QUEUE_CAPACITY:1000}
